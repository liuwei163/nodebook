# =============================================================================
# 轻量 Grafana（离线单实例，无外部依赖，自动装载 MLflow 看板）
#
# 前置三步：
#   ① 导入镜像到 Harbor（走你们的镜像导入流程），例如：
#      grafana/grafana:10.4.10  →  harbor.ai.cnpc/ai-platform-poc/grafana:v10.4.10
#      （版本不限 9.x/10.x/11.x 均可，dashboards json 兼容 schemaVersion 39）
#   ② 确认 Prometheus 的 Service 地址：
#      kubectl -n kube-system get svc | grep -i prom
#      把下面 datasources 里的 url 改成实际地址（默认端口多为 9090）
#   ③ 创建看板 ConfigMap（在 /opt/mlflow 目录）：
#      kubectl -n ml-platform create configmap grafana-mlflow-dashboard \
#        --from-file=03-监控接入/03-mlflow-grafana-dashboard.json
#
# 部署：kubectl apply -f 03-监控接入/03-grafana-lite.yaml
# 访问：http://<任意节点IP>:30300   （匿名只读，无需登录）
#
# 安全说明：开启了匿名 Viewer（内网 POC 场景图省事）。若要加登录：
#   删掉两个 GF_AUTH_ANONYMOUS_* 环境变量，加
#   GF_SECURITY_ADMIN_PASSWORD=<密码>
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ml-platform
data:
  prom.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://cmss-kcs-prometheus.kube-system.svc.cluster.local:9090   # TODO 按实际 Service 地址改
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: ml-platform
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: mlflow
        type: file
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ml-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: harbor.ai.cnpc/ai-platform-poc/grafana:v10.4.10   # TODO 按实际导入的镜像改
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-mlflow-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ml-platform
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
