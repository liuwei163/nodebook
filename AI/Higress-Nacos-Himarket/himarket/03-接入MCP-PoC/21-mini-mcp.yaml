# mini-mcp 部署清单（v2：使用 Harbor 里已有的 kubeflow/python:3.7 镜像）
#
# ── 部署到哪个集群 / 要不要走网关（决策记录，别删）─────────────────────────
# 结论：部署到 HiMarket 集群的 himarket namespace，用 ClusterIP 直连，不过网关。
#
# 理由：
#   1) 调用方只有一个 —— himarket-server 里的 HiChat（ChatService.buildMCPConfigs
#      自己就是 MCP 客户端，直接 new 传输层去连），同集群 ClusterIP 最短路径；
#   2) 不过 higress 就不用碰 McpBridge / nacosGroups / allowMcpServers 白名单 /
#      mcpServerExportDomains / mcp.example.internal 域名解析这一整串（之前卡最久的地方）；
#   3) MCP 的鉴权、订阅、配额本来就由 HiMarket 自己管，前面再套一层网关是重复鉴权。
#
# 什么时候才需要网关（这时才考虑给 Service 加 Ingress / 换暴露方式）：
#   - 这个 MCP 要被另一个集群访问（模型集群的 HiCoding、外部系统）；
#   - 要用 higress 的 MCP 聚合（一个域名挂多个 MCP Server）；
#   - 要统一做限流、审计、mTLS。
#   注意：本集群已禁用 NodePort（安全策略），所以不能靠 nodePort 对外暴露，
#   将来要对外只能走 higress Ingress 或 LoadBalancer。
#
# 什么时候该反过来放模型集群：
#   - MCP 工具本身要访问模型集群内部资源（查 NPU、调 vllm、读模型目录）。
#     放 himarket 集群会多一跳跨集群，且要额外开网络策略。
#
# ─────────────────────────────────────────────────────────────────────────
# 与 v1 的区别：
#   v1 假设节点上有 python3 —— 你们的节点只有 python 2.7.8，不可行；
#   v2 直接跑成 Pod，代码用 ConfigMap 挂进去，不依赖宿主机 python。
#   脚本用 11-mini_mcp_py2.py（py2/py3 双兼容），镜像里是 py3.7 也能直接跑。
#
# 部署前先执行这两条，把下面 image 里的 <HARBOR> 换成真实前缀：
#   kubectl -n himarket get deploy himarket-server \
#     -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}{.spec.template.spec.imagePullSecrets}{"\n"}'
#
# 一键部署（在本文件所在目录执行）：
#   kubectl -n himarket create configmap mini-mcp-src \
#     --from-file=11-mini_mcp_py2.py=./11-mini_mcp_py2.py --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f 21-mini-mcp.yaml
#   kubectl -n himarket rollout status deploy/mini-mcp

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-mcp
  namespace: himarket
  labels:
    app: mini-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-mcp
  template:
    metadata:
      labels:
        app: mini-mcp
    spec:
      # ▼ 如果 Harbor 需要认证，去掉下面这行的注释并填 himarket 里现有的 secret 名
      # imagePullSecrets:
      #   - name: harbor-secret
      containers:
        - name: mini-mcp
          # ▼▼▼ 换成真实地址，形如 harbor.example.internal/ai-platform/kubeflow/python:3.7
          image: <HARBOR>/ai-platform/kubeflow/python:3.7
          imagePullPolicy: IfNotPresent
          # python3 找不到就退回 python，两种镜像布局都能启动
          command: ["/bin/sh", "-c"]
          args:
            - exec python3 /app/11-mini_mcp_py2.py 8765 || exec python /app/11-mini_mcp_py2.py 8765
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONIOENCODING
              value: UTF-8
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8765
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: src
              mountPath: /app
              readOnly: true
      volumes:
        - name: src
          configMap:
            name: mini-mcp-src

---
apiVersion: v1
kind: Service
metadata:
  name: mini-mcp
  namespace: himarket
  labels:
    app: mini-mcp
spec:
  # 本集群不允许 NodePort（安全策略），只能用 ClusterIP。
  # 调用方 himarket-server 与 mini-mcp 同集群同命名空间，svc 域名直连即可。
  type: ClusterIP
  selector:
    app: mini-mcp
  ports:
    - name: http
      port: 8765          # 集群内访问端口（svc 名:8765）
      targetPort: 8765    # 容器端口
      # nodePort: 30765   # 本集群禁用，保留备用

# ---------------------------------------------------------------------------
# 部署后只有一个可用地址（集群内）：
#     http://mini-mcp.himarket.svc.cluster.local:8765/mcp
#
# 用完整域名而不是 mini-mcp.himarket:8765，是为了避免某些 HTTP 客户端
# 依赖 search domain 拼接、拼出短域名解析失败的情况。
#
# 跳板机要在本地测，用端口转发（另开一个终端保持运行）：
#     kubectl -n himarket port-forward svc/mini-mcp 8765:8765
#     然后本机：sh 12-test-mini-mcp.sh 127.0.0.1:8765
# ---------------------------------------------------------------------------
# 排查用：
#   kubectl -n himarket get pod -l app=mini-mcp -o wide
#   kubectl -n himarket logs deploy/mini-mcp --tail=50
#   kubectl -n himarket get svc mini-mcp
#   kubectl -n himarket exec deploy/himarket-server -- \
#     curl -sS -m 5 http://mini-mcp.himarket.svc.cluster.local:8765/
# ---------------------------------------------------------------------------
