# =============================================================================
# Qwen3-32B · Kthena ModelServing（昇腾 910 × 8，TP=8 共置单实例）
#
# 基线：dk32-pd2.yaml（方案三 共置单实例）
# 改动：仅换模型路径/服务名 + 增加 tool calling 三个参数 + 放宽就绪探针
# 用法：kubectl apply -f 21-qwen3-32b-modelserving.yaml
#
# ⚠ 前置：该节点 8 张卡已被 R1-Distill 占满，必须先停掉旧实例才能调度
# =============================================================================
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: qwen3-32b                       # 资源名，改名即新建一个实例，旧实例不会自动删除
  namespace: kthena-system
spec:
  # 按角色滚动更新：单角色共置下等价于"先起新的、就绪后再删旧的"，
  # 但 8 卡被占满时新旧无法并存，实际表现为先停后起
  rolloutStrategy:
    type: RoleRollingUpdate

  # 用 volcano 调度器：昇腾多卡场景需要 gang scheduling（8 卡一次性占齐，
  # 避免调度到一半卡不够导致死等）
  schedulerName: volcano

  # 整个 ModelServing 的副本倍数（乘以各 role 的 replicas）
  replicas: 1

  # 角色内某个 Pod 故障时，重建整个角色（而不是单独补一个 Pod），
  # 保证 TP 组内的所有成员版本一致
  recoveryPolicy: RoleRecreate

  template:
    # 重启前给容器 60 秒做优雅退出，避免 TP 组里其他成员等待超时
    restartGracePeriodSeconds: 60

    roles:
      # ---------- 唯一角色：同时承担 prefill 与 decode ----------
      - name: server                     # 角色名，单角色共置时可任意命名
        replicas: 1
        maxUnavailable: 1                # 滚动更新时允许 1 个 Pod 不可用

        entryTemplate:
          spec:
            # 锁定节点：模型走 hostPath 挂载本地 NFS，必须落在同一台机器；
            # 同时该节点才有 8 张 Ascend910
            nodeSelector:
              kubernetes.io/hostname: <MODEL_CLUSTER_NODE>

            # 容忍该节点的两个污点，否则 Pod 无法调度上去：
            #   node-unschedulable → 节点被标记不可调度
            #   volcano.sh/dedicated=only-npu → 该节点专供 NPU 负载
            tolerations:
              - key: node-unschedulable
                operator: Equal
                value: "true"
                effect: NoSchedule
              - key: volcano.sh/dedicated
                operator: Equal
                value: only-npu
                effect: NoSchedule

            # 从私有 Harbor 拉镜像用的凭据
            imagePullSecrets:
              - name: harbor-secret

            containers:
              - name: vllm
                # 昇腾专用 vLLM 发行版，与 vLLM 上游 API 兼容（含 tool-call-parser）
                image: harbor.example.internal/repo/ascend/vllm-ascend:v0.22.1rc1
                imagePullPolicy: IfNotPresent

                ports:
                  - containerPort: 8000      # OpenAI 兼容 API 端口

                env:
                  # --- 昇腾运行时相关 ---
                  - name: ASCEND_TASK_QUEUE_ENABLE
                    value: "1"               # 开启任务队列，多流并发时提升吞吐
                  - name: ASCEND_HCCN_CONFIG_PATH
                    value: "/etc/hccn.conf"  # HCCN 网卡配置文件路径（多卡互联必需）
                  - name: ASCEND_CONNECT_TIMEOUT
                    value: "30000"           # HCCL 建链超时 30s，机内多卡建链需留足时间
                  - name: ASCEND_AUTO_CONNECT
                    value: "true"            # 自动建立 HCCL 连接
                  - name: ASCEND_USE_SHORT_CONNECTION
                    value: "true"            # 使用短连接，减少长连接资源占用
                  - name: ASCEND_SLOG_PRINT_TO_STDOUT
                    value: "0"               # 关闭 CANN 底层 C++ 日志，避免刷屏淹没 vLLM 日志
                  - name: LD_LIBRARY_PATH
                    value: "/usr/local/lib:/usr/local/Ascend/nnal/atb/9.0.0/atb/cxx_abi_1/lib:/usr/local/Ascend/driver/lib64/driver:/usr/local/Ascend/cann-9.0.0/aarch64-linux/lib64:$LD_LIBRARY_PATH"

                  # --- 离线与通信 ---
                  - name: HF_HUB_OFFLINE
                    value: "1"               # 禁止联网拉模型，内网环境必须开，否则启动时会去连 huggingface 卡住
                  - name: HCCL_IF_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP   # HCCL 用 Pod IP 建链
                  - name: GLOO_SOCKET_IFNAME
                    value: eth0              # 以下三个指定分布式通信走 eth0，Pod 内通常只有这块网卡
                  - name: TP_SOCKET_IFNAME
                    value: eth0
                  - name: HCCL_SOCKET_IFNAME
                    value: eth0

                  - name: VLLM_LOGGING_LEVEL
                    value: INFO             # 首次部署保持 INFO，便于确认模型加载与 tool parser 注册

                  # 由昇腾 device plugin 把实际分配的物理卡号写进 Pod 注解，
                  # 容器内通过该变量读取，保证 TP 组拿到的是同一批卡
                  - name: AscendRealDevices
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.annotations['huawei.com/AscendReal']

                # 先 source CANN 环境脚本，再启动 OpenAI 兼容服务
                command: ["/bin/bash", "-c"]
                args:
                  - >-
                    source /usr/local/Ascend/ascend-toolkit/set_env.sh &&
                    python3 -m vllm.entrypoints.openai.api_server
                    --host 0.0.0.0
                    --port 8000
                    --model /models/Qwen3-32B
                    --served-model-name qwen3-32b
                    --tensor-parallel-size 8
                    --gpu-memory-utilization 0.92
                    --max-model-len 32768
                    --max-num-batched-tokens 16384
                    --no-enable-log-requests
                    --disable-log-stats
                    --trust-remote-code
                    --enable-auto-tool-choice
                    --tool-call-parser hermes
                    --reasoning-parser qwen3

                resources:
                  limits:
                    cpu: "64"
                    memory: 512Gi
                    huawei.com/Ascend910: 8   # 8 卡全给一个实例，TP 必须等于该值
                  requests:
                    cpu: "64"
                    memory: 512Gi
                    huawei.com/Ascend910: 8

                # 就绪探针：32B 从 NFS 加载 + 昇腾算子编译，实测可能 5-8 分钟。
                # 300s 初始延迟 + 30 次 × 10s 宽限 = 最长 600s，避免加载中被误杀重启
                readinessProbe:
                  initialDelaySeconds: 300
                  periodSeconds: 10
                  failureThreshold: 30
                  httpGet:
                    path: /health
                    port: 8000

                volumeMounts:
                  - name: models
                    mountPath: /models
                    readOnly: true
                  - name: hccn-config
                    mountPath: /etc/hccn.conf
                    readOnly: true
                  - name: shared-memory-volume
                    mountPath: /dev/shm            # vLLM 多进程通信需要较大的共享内存
                  - name: ascend-driver
                    mountPath: /usr/local/Ascend/driver
                    readOnly: true

            volumes:
              - name: models
                hostPath:
                  path: /mnt/nfs-temp/models/      # 节点本地挂载的 NFS 根目录
                  type: DirectoryOrCreate
              - name: hccn-config
                hostPath:
                  path: /etc/hccn.conf
                  type: FileOrCreate
              - name: shared-memory-volume
                emptyDir:
                  medium: Memory                   # /dev/shm 用内存盘
              - name: ascend-driver
                hostPath:
                  path: /usr/local/Ascend/driver
                  type: Directory

        # 共置单实例不需要 worker（PD 分离方案里才用）
        workerReplicas: 0
        workerTemplate:
          spec:
            containers: []

# =============================================================================
# 本次改动清单（对比 dk32-pd2.yaml）
#
#   1. metadata.name          deepseek-r1-distill-qwen-32b → qwen3-32b
#   2. --model                /models/DeepSeek-R1-Distill-Qwen-32B → /models/Qwen3-32B
#   3. --served-model-name    DeepSeek-R1-Distill-Qwen-32B → qwen3-32b
#       （HiMarket 里配置的模型名必须与此一致）
#   4. --max-model-len        8192 → 32768（Qwen3 原生支持 32K，8192 会截断多轮工具对话）
#   5. 新增 --enable-auto-tool-choice   开启自动工具选择，不开启则带 tools 的请求直接 400
#   6. 新增 --tool-call-parser hermes   Qwen3 输出 <tool_call>{json}</tool_call>，对应 hermes 解析器
#   7. 新增 --reasoning-parser qwen3    把思考链拆到 reasoning_content；
#                                       若该版本不认识 qwen3，先删掉这一项验证服务能起
#   8. readinessProbe         initialDelaySeconds 180 → 300，failureThreshold 8 → 30
#
# 保持不变（已验证可用，别动）：
#   TP=8、gpu-memory-utilization=0.92、max-num-batched-tokens=16384、
#   所有 ASCEND_* 环境变量、nodeSelector、tolerations、hostPath 挂载
# =============================================================================
