# Higress 安装自定义配置(离线环境 + NodePort)
# 镜像走本地私有仓库 easzlab.io.local:5000(已推入 4 个 higress 镜像)

global:
  # 本地仓库地址,覆盖 core 组件 (gateway/higress/pilot) 的 registry
  hub: 192.168.208.127/k8s-images
  imagePullSecrets:
    - name: harbor-secret
  # 本地集群标记(关闭部分对云环境的依赖)
  local: false
  o11y:
    # 关闭可观测性组件(grafana/prometheus/loki),它们需要 PVC 且环境无 StorageClass
    enabled: false

# Higress Gateway(数据面)——位于子 chart higress-core,需用前缀 higress-core 覆盖
higress-core:
  gateway:
    replicas: 3
    nodeSelector:
      higress-ingress: "true"
    service:
      # 用 NodePort 对外暴露(集群无 LoadBalancer)
      type: NodePort
      ports:
        - name: http2
          port: 80
          targetPort: 80
          protocol: TCP
          # NodePort 端口(http)
          nodePort: 30080
        - name: https
          port: 443
          targetPort: 443
          protocol: TCP
          # NodePort 端口(https)
          nodePort: 30443

# Higress Console(管理控制台)
higress-console:
  # console 镜像独立配置,指向本地仓库
  image:
    repository: 192.168.208.127/k8s-images/higress/console
    tag: "2.2.4"
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: harbor-secret
  service:
    # 控制台用 NodePort 暴露
    type: ClusterIP
    port: 8080
    nodePort: 30088
  # o11y 子项默认 enabled:false,显式关闭以避免 PVC
  global:
    o11y:
      enabled: false
  # 管理员账号(可登录后修改)
  admin:
    username: admin
    password: "Pnb4qvfMOoSrcPH22nG6w_"
  pvc:
    rwxSupported: false